name: Fetch GSX-S1000GX prices

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch listings from 번개장터
        run: node price-alert/scripts/fetch-bunjang.mjs

      - name: Fetch listings from 바튜매(네이버 검색)
        run: node price-alert/scripts/fetch-naver-cafe.mjs
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price-alert/data/bunjang-listings.json price-alert/data/naver-cafe-listings.json
          git diff --cached --quiet || git commit -m "chore: 시세 자동 갱신"
          git push

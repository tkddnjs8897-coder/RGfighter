<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스즈키 GSX-S1000GX 시세알리미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #fbfbfd;
    --border: #e1e5ec;
    --text: #161a20;
    --text-muted: #5b6472;
    --accent: #ea6a12;
    --accent-ink: #ffffff;
    --link: #1d5fd6;
    --link-bg: #eaf1ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 64px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .ticker {
    background: linear-gradient(180deg, #fff 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(20, 30, 45, 0.06);
  }

  .ticker-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }

  .ticker-value {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--text);
    text-wrap: balance;
  }

  .ticker-value .num {
    font-family: "Chakra Petch", "Noto Sans KR", sans-serif;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 1px 3px rgba(20, 30, 45, 0.05);
  }

  .card h2 {
    margin: 0 0 4px;
    font-size: 0.95rem;
    font-weight: 700;
  }

  .hint {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin: 4px 0 0;
  }

  #list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }

  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }

  .row-main { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }

  .row-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

  .price {
    font-family: "Chakra Petch", "Noto Sans KR", sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .badge {
    background: var(--link-bg);
    color: var(--link);
    font-weight: 700;
    font-size: 0.72rem;
    padding: 2px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .summary { font-size: 0.88rem; color: var(--text); word-break: keep-all; }

  .tag {
    font-size: 0.74rem;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tag.link { background: var(--link-bg); color: var(--link); text-decoration: none; }

  .empty { color: var(--text-muted); font-size: 0.85rem; margin: 8px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex; flex-direction:column; gap:10px;">
    <h1>🏍️ 스즈키 GSX-S1000GX 시세알리미</h1>
    <div class="ticker">
      <p class="ticker-label">번개장터 최저 시세</p>
      <p class="ticker-value" id="headline">불러오는 중...</p>
      <p class="hint" id="updatedAt"></p>
    </div>
  </header>

  <section class="card">
    <h2>매물 (<span id="count">0</span>) · 저렴한 순</h2>
    <p class="hint">번개장터 공개 검색 결과를 6시간마다 자동으로 가져옵니다. 로그인이 필요한 바튜매(네이버카페)와 공식 API가 없는 당근마켓·라이트바겐은 자동 수집 대상에서 제외했어요.</p>
    <div id="list"></div>
  </section>

</div>

<script>
(function () {
  var DATA_URL = './data/bunjang-listings.json';

  function won(n) { return Number(n).toLocaleString('ko-KR') + '원'; }
  function manwon(n) { return Math.round(Number(n) / 10000).toLocaleString('ko-KR') + '만원'; }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function formatUpdated(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return '마지막 갱신 ' + d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  var headline = document.getElementById('headline');
  var updatedAt = document.getElementById('updatedAt');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');

  function renderError(message) {
    headline.textContent = message;
    listEl.innerHTML = '';
  }

  function render(data) {
    var items = Array.isArray(data.items) ? data.items : [];
    countEl.textContent = items.length;
    updatedAt.textContent = formatUpdated(data.fetchedAt);

    if (data.lastError) {
      updatedAt.textContent += (updatedAt.textContent ? ' · ' : '') + '최근 자동 갱신 실패, 마지막 성공 데이터를 보여줍니다';
    }

    if (items.length === 0) {
      headline.textContent = '아직 수집된 매물이 없습니다';
      listEl.innerHTML = '<p class="empty">잠시 후 다시 확인해주세요.</p>';
      return;
    }

    var sorted = items.slice().sort(function (a, b) { return a.price - b.price; });
    headline.innerHTML = '<span class="num">' + manwon(sorted[0].price) + '</span>';

    listEl.innerHTML = '';
    sorted.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<div class="row-main">' +
          '<div class="row-top">' +
            '<span class="price">' + won(item.price) + '</span>' +
            '<span class="badge">' + escapeHtml(item.platform || '번개장터') + '</span>' +
          '</div>' +
          '<div class="summary">' + escapeHtml(item.title || '') + '</div>' +
        '</div>' +
        (item.url ? '<a class="tag link" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">원문보기</a>' : '');
      listEl.appendChild(row);
    });
  }

  fetch(DATA_URL, { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('데이터를 불러오지 못했습니다');
      return res.json();
    })
    .then(render)
    .catch(function () {
      renderError('시세를 불러오지 못했습니다');
    });
})();
</script>
</body>
</html>

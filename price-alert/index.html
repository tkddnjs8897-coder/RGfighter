<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>스즈키 GSX-S1000GX 시세알리미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #fbfbfd;
    --border: #e1e5ec;
    --text: #161a20;
    --text-muted: #5b6472;
    --accent: #ea6a12;
    --accent-ink: #ffffff;
    --danger: #c62828;
    --danger-bg: #fde8e8;
    --link: #1d5fd6;
    --link-bg: #eaf1ff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 64px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .ticker {
    background: linear-gradient(180deg, #fff 0%, var(--surface-2) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(20, 30, 45, 0.06);
  }

  .ticker-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 6px;
  }

  .ticker-value {
    margin: 0;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--text);
    text-wrap: balance;
  }

  .ticker-value .num {
    font-family: "Chakra Petch", "Noto Sans KR", sans-serif;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 1px 3px rgba(20, 30, 45, 0.05);
  }

  .card h2 {
    margin: 0 0 4px;
    font-size: 0.95rem;
    font-weight: 700;
  }

  .hint {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin: 4px 0 0;
  }

  .search-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .search-row input[type="text"] { flex: 1; min-width: 140px; }

  input, select, button { font-family: inherit; font-size: 0.92rem; }

  input[type="text"], input[type="number"], input[type="url"], select {
    background: #fff;
    border: 1px solid #c7ced7;
    color: var(--text);
    border-radius: 8px;
    padding: 9px 10px;
    width: 100%;
  }

  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 600;
  }

  label.checkbox { flex-direction: row; align-items: center; gap: 7px; }
  label.checkbox input { width: auto; }
  label.checkbox.warn { color: var(--danger); }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    margin: 12px 0;
  }

  button {
    background: var(--accent);
    border: none;
    color: var(--accent-ink);
    font-weight: 700;
    padding: 10px 16px;
    border-radius: 9px;
    cursor: pointer;
  }
  button:active { filter: brightness(0.95); }

  .search-row button {
    background: var(--surface-2);
    color: var(--text);
    font-weight: 600;
    border: 1px solid var(--border);
    padding: 9px 12px;
  }

  .error { color: var(--danger); font-size: 0.8rem; font-weight: 600; margin: 8px 0 0; }

  #list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }

  .row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }

  .row-main { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }

  .row-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

  .price {
    font-family: "Chakra Petch", "Noto Sans KR", sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .badge {
    background: var(--link-bg);
    color: var(--link);
    font-weight: 700;
    font-size: 0.72rem;
    padding: 2px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .summary { font-size: 0.88rem; color: var(--text); word-break: keep-all; }

  .tags { display: flex; gap: 6px; flex-wrap: wrap; }

  .tag {
    font-size: 0.74rem;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .tag.tuned { background: #fdeee0; color: #b5560a; }
  .tag.note { background: #eef1f5; color: var(--text-muted); }
  .tag.link { background: var(--link-bg); color: var(--link); text-decoration: none; }
  .tag.warn { background: var(--danger-bg); color: var(--danger); font-weight: 700; }

  .del {
    background: #fff;
    color: var(--danger);
    border: 1px solid var(--danger);
    padding: 6px 11px;
    font-weight: 600;
    border-radius: 8px;
    font-size: 0.82rem;
    flex-shrink: 0;
  }
  .del:active { background: var(--danger-bg); }

  .empty { color: var(--text-muted); font-size: 0.85rem; margin: 8px 0 0; }

  .storage-note {
    font-size: 0.74rem;
    color: var(--text-muted);
    text-align: center;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex; flex-direction:column; gap:10px;">
    <h1>🏍️ 스즈키 GSX-S1000GX 시세알리미</h1>
    <div class="ticker">
      <p class="ticker-label">오늘자 대표 시세</p>
      <p class="ticker-value" id="headline">매물을 등록하면 시세가 표시됩니다</p>
    </div>
  </header>

  <section class="card">
    <h2>빠른 검색</h2>
    <p class="hint">각 플랫폼에서 직접 검색해 가격을 확인한 뒤 아래에 등록하세요.</p>
    <div class="search-row">
      <input type="text" id="kw" value="스즈키 GSX-S1000GX" />
      <button type="button" data-site="daangn">당근마켓</button>
      <button type="button" data-site="bunjang">번개장터</button>
      <button type="button" data-site="naver">네이버</button>
    </div>
    <p class="hint">바튜매(네이버카페)·라이트바겐은 로그인/전용 도메인이 필요해 링크를 만들지 않아요. 직접 방문해서 확인한 가격을 입력해주세요.</p>
  </section>

  <section class="card">
    <h2>매물 등록</h2>
    <form id="form">
      <div class="form-grid">
        <label>플랫폼
          <select name="platform" required>
            <option value="바튜매">바튜매(네이버카페)</option>
            <option value="당근마켓">당근마켓</option>
            <option value="번개장터">번개장터</option>
            <option value="라이트바겐">라이트바겐</option>
            <option value="기타">기타</option>
          </select>
        </label>
        <label>가격(원)<input type="number" name="price" min="1" required /></label>
        <label>년식<input type="number" name="year" min="1990" max="2100" required /></label>
        <label>키로수(km)<input type="number" name="mileage" min="0" required /></label>
        <label class="checkbox"><input type="checkbox" name="tuned" />튜닝됨</label>
        <label>튜닝 내용(선택)<input type="text" name="tuningNote" placeholder="예: 머플러, ECU맵핑" /></label>
        <label class="checkbox"><input type="checkbox" name="topBox" />탑박스 있음</label>
        <label class="checkbox"><input type="checkbox" name="blackBox" />블랙박스 있음</label>
        <label class="checkbox"><input type="checkbox" name="engineGuard" />엔진가드 있음</label>
        <label class="checkbox warn"><input type="checkbox" name="crashHistory" />사고이력 있음</label>
        <label class="checkbox warn"><input type="checkbox" name="tipOver" />꿍(전도) 있음</label>
        <label>출처 링크(선택)<input type="url" name="url" placeholder="https://..." /></label>
        <label>메모(선택)<input type="text" name="note" /></label>
      </div>
      <button type="submit">매물 등록</button>
      <p id="formError" class="error"></p>
    </form>
  </section>

  <section class="card">
    <h2>등록된 매물 (<span id="count">0</span>) · 저렴한 순</h2>
    <div id="list"></div>
  </section>

  <p class="storage-note">이 기기(브라우저)에만 저장됩니다. 다른 기기와는 공유되지 않아요.</p>
</div>

<script>
(function () {
  var STORAGE_KEY = 'gsxS1000gxListings';

  var SEARCH_URLS = {
    daangn: function (q) { return 'https://www.daangn.com/search/' + encodeURIComponent(q); },
    bunjang: function (q) { return 'https://m.bunjang.co.kr/search/products?order=score&q=' + encodeURIComponent(q); },
    naver: function (q) { return 'https://search.naver.com/search.naver?query=' + encodeURIComponent(q); }
  };

  document.querySelectorAll('.search-row button[data-site]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var q = document.getElementById('kw').value.trim();
      if (!q) return;
      window.open(SEARCH_URLS[btn.dataset.site](q), '_blank', 'noopener');
    });
  });

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function save(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) {
      /* 저장 공간이 없거나 접근이 막힌 경우 조용히 무시 */
    }
  }

  function won(n) { return Number(n).toLocaleString('ko-KR') + '원'; }
  function manwon(n) { return Math.round(Number(n) / 10000).toLocaleString('ko-KR') + '만원'; }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function dateLabel(iso) {
    var d = new Date(iso);
    var now = new Date();
    if (d.toDateString() === now.toDateString()) return '오늘자';
    return (d.getMonth() + 1) + '/' + d.getDate() + ' 등록';
  }

  function summaryLine(item) {
    var mileage = Number(item.mileage).toLocaleString('ko-KR');
    var marks = [
      '탑박스' + (item.topBox ? 'O' : 'X'),
      '블박' + (item.blackBox ? 'O' : 'X'),
      '엔진가드' + (item.engineGuard ? 'O' : 'X'),
      '사고' + (item.crashHistory ? 'O' : 'X'),
      '꿍' + (item.tipOver ? 'O' : 'X')
    ].join(' ');
    return dateLabel(item.createdAt) + ' ' + item.year + '년식, ' + mileage + 'km, 가격은 ' + won(item.price) + '입니다 (' + marks + ')';
  }

  var headline = document.getElementById('headline');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var form = document.getElementById('form');
  var formError = document.getElementById('formError');

  function render() {
    var listings = load();
    countEl.textContent = listings.length;

    if (listings.length === 0) {
      headline.innerHTML = '매물을 등록하면 시세가 표시됩니다';
      listEl.innerHTML = '<p class="empty">아직 등록된 매물이 없습니다.</p>';
      return;
    }

    var min = Math.min.apply(null, listings.map(function (l) { return l.price; }));
    headline.innerHTML = '오늘자 시세는 <span class="num">' + manwon(min) + '</span>입니다';

    var sorted = listings.slice().sort(function (a, b) { return a.price - b.price; });
    listEl.innerHTML = '';

    sorted.forEach(function (item) {
      var row = document.createElement('div');
      row.className = 'row';

      var tagsHtml = '';
      if (item.tuned) tagsHtml += '<span class="tag tuned">튜닝: ' + escapeHtml(item.tuningNote || '내용 없음') + '</span>';
      if (item.crashHistory) tagsHtml += '<span class="tag warn">사고이력</span>';
      if (item.tipOver) tagsHtml += '<span class="tag warn">꿍(전도)</span>';
      if (item.note) tagsHtml += '<span class="tag note">' + escapeHtml(item.note) + '</span>';
      if (item.url) tagsHtml += '<a class="tag link" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">원문보기</a>';

      row.innerHTML =
        '<div class="row-main">' +
          '<div class="row-top">' +
            '<span class="price">' + won(item.price) + '</span>' +
            '<span class="badge">' + escapeHtml(item.platform) + '</span>' +
          '</div>' +
          '<div class="summary">' + escapeHtml(summaryLine(item)) + '</div>' +
          (tagsHtml ? '<div class="tags">' + tagsHtml + '</div>' : '') +
        '</div>' +
        '<button class="del" data-id="' + item.id + '">삭제</button>';

      listEl.appendChild(row);
    });

    listEl.querySelectorAll('.del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var listings = load().filter(function (l) { return l.id !== btn.dataset.id; });
        save(listings);
        render();
      });
    });
  }

  function validate(payload) {
    var errors = [];
    if (!Number.isFinite(payload.price) || payload.price <= 0) errors.push('가격이 올바르지 않습니다.');
    if (!Number.isFinite(payload.year) || payload.year < 1990 || payload.year > 2100) errors.push('년식이 올바르지 않습니다.');
    if (!Number.isFinite(payload.mileage) || payload.mileage < 0) errors.push('키로수가 올바르지 않습니다.');
    if (!payload.platform) errors.push('플랫폼을 선택해주세요.');
    return errors;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    formError.textContent = '';
    var fd = new FormData(form);
    var payload = {
      platform: fd.get('platform'),
      price: Number(fd.get('price')),
      year: Number(fd.get('year')),
      mileage: Number(fd.get('mileage')),
      tuned: fd.get('tuned') === 'on',
      tuningNote: fd.get('tuningNote') || '',
      topBox: fd.get('topBox') === 'on',
      blackBox: fd.get('blackBox') === 'on',
      engineGuard: fd.get('engineGuard') === 'on',
      crashHistory: fd.get('crashHistory') === 'on',
      tipOver: fd.get('tipOver') === 'on',
      url: fd.get('url') || '',
      note: fd.get('note') || ''
    };

    var errors = validate(payload);
    if (errors.length) {
      formError.textContent = errors.join(', ');
      return;
    }

    payload.id = (Date.now().toString(36) + Math.random().toString(36).slice(2, 8));
    payload.createdAt = new Date().toISOString();

    var listings = load();
    listings.push(payload);
    save(listings);
    form.reset();
    render();
  });

  render();
})();
</script>
</body>
</html>

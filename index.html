<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>라갤러파이트</title>
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>

<div id="rotateHint">📱↻<br>가로 모드로 돌려서 플레이해주세요</div>

<div id="app">
<div id="stage">

  <!-- 캐릭터 선택 화면 -->
  <div id="selectScreen" class="screen">
    <h1>라갤러파이트</h1>
    <p class="subtitle">캐릭터를 선택하세요</p>
    <div class="selectGrid" id="selectGrid"></div>
    <p class="hint">방향키 이동/점프/앉기 · Z X C V 공격 · A S D 필살기 · Space 궁극기 · Shift 서서 막기 · Shift+↓ 앉아 막기</p>
  </div>

  <!-- 맵 선택 화면 -->
  <div id="mapScreen" class="screen hidden">
    <h1>맵 선택</h1>
    <p class="subtitle">싸울 장소를 선택하세요</p>
    <div class="selectGrid" id="mapGrid"></div>
    <button id="mapBackBtn" class="backBtn">‹ 캐릭터 다시 선택</button>
  </div>

  <!-- 게임 화면 -->
  <div id="gameScreen" class="screen hidden">
    <div id="hud">
      <div class="fighterHud left">
        <img id="p1Portrait" class="portrait" />
        <div class="bars">
          <div class="name" id="p1Name"></div>
          <div class="hpBarOuter"><div class="hpBar" id="p1Hp"></div></div>
          <div class="gaugeBarOuter"><div class="gaugeBar special" id="p1SpecialGauge"></div></div>
          <div class="gaugeBarOuter"><div class="gaugeBar ult" id="p1UltGauge"></div></div>
        </div>
      </div>
      <div class="timer" id="timer">60</div>
      <div class="fighterHud right">
        <div class="bars">
          <div class="name" id="p2Name"></div>
          <div class="hpBarOuter"><div class="hpBar" id="p2Hp"></div></div>
          <div class="gaugeBarOuter"><div class="gaugeBar special" id="p2SpecialGauge"></div></div>
          <div class="gaugeBarOuter"><div class="gaugeBar ult" id="p2UltGauge"></div></div>
        </div>
        <img id="p2Portrait" class="portrait" />
      </div>
    </div>
    <div id="canvasWrap">
      <canvas id="canvas" width="960" height="540"></canvas>
    </div>
    <div id="moveBar">
      <div class="moveKey" id="mkP1">Z 주먹1</div>
      <div class="moveKey" id="mkP2">X 주먹2</div>
      <div class="moveKey" id="mkK1">C 발차기1</div>
      <div class="moveKey" id="mkK2">V 발차기2</div>
      <div class="moveKey" id="mkS1">A 필살기1</div>
      <div class="moveKey" id="mkS2">S 필살기2</div>
      <div class="moveKey" id="mkS3">D 필살기3</div>
      <div class="moveKey ult" id="mkUlt">Space 궁극기</div>
      <div class="moveKey" id="mkBlock">Shift 서서막기 · Shift+↓ 앉아막기</div>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen" class="screen hidden">
    <h1 id="resultText">WIN</h1>
    <button id="retryBtn">다시하기</button>
  </div>

</div>
</div>

<!-- 모바일 터치 컨트롤: #stage의 scale() 밖에 둬서 화면이 아무리 축소돼도 버튼 크기는 그대로 유지됨 -->
<div id="touchControls" class="hidden">
  <div class="tcCluster tcLeft">
    <div class="tcJoystick" id="tcJoystick">
      <div class="tcJoystickKnob" id="tcJoystickKnob"></div>
    </div>
    <button class="tcBtn tcGuardBtn" data-key="ShiftLeft">막기</button>
  </div>
  <div class="tcCluster tcRight">
    <div class="tcSpecialRow">
      <button class="tcBtn tcLabel" id="tcS1" data-key="KeyA">필살기1</button>
      <button class="tcBtn tcLabel" id="tcS2" data-key="KeyS">필살기2</button>
      <button class="tcBtn tcLabel" id="tcS3" data-key="KeyD">필살기3</button>
    </div>
    <button class="tcBtn tcUltBtn" data-key="Space">궁극기</button>
    <div class="tcAtkPad">
      <button class="tcBtn tcLabel tcAtkX" id="tcP2" data-key="KeyX">스트레이트</button>
      <button class="tcBtn tcLabel tcAtkZ" id="tcP1" data-key="KeyZ">잽</button>
      <button class="tcBtn tcLabel tcAtkV" id="tcK2" data-key="KeyV">하이킥</button>
      <button class="tcBtn tcLabel tcAtkC" id="tcK1" data-key="KeyC">로우킥</button>
    </div>
  </div>
</div>

<script src="js/characters.js?v=37"></script>
<script src="js/main.js?v=37"></script>
</body>
</html>
